<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ED2C39"/>
      <stop offset="1" stop-color="#C8121E"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square red gradient tile (22% radius per brand sheet) -->
  <rect width="1024" height="1024" rx="225" fill="url(#redGrad)"/>

  <!-- Block Monogram BP — white on red. Original viewBox 0 0 240 200 scaled into 640×533, centered. -->
  <g transform="translate(192 246) scale(2.667)">
    <g fill="#FAFAF7">
      <!-- B -->
      <rect x="10" y="20" width="34" height="160"/>
      <path d="M44 20 H86 a40 40 0 0 1 0 80 H44 Z"/>
      <path d="M44 100 H92 a40 40 0 0 1 0 80 H44 Z"/>
      <!-- B counters knocked out in red (matches gradient mid-tone) -->
      <rect x="44" y="44" width="40" height="32" fill="#D71F2C"/>
      <rect x="44" y="124" width="46" height="32" fill="#D71F2C"/>
      <!-- P -->
      <rect x="140" y="20" width="34" height="160"/>
      <path d="M174 20 H216 a44 44 0 0 1 0 88 H174 Z"/>
      <rect x="174" y="44" width="40" height="40" fill="#D71F2C"/>
    </g>
  </g>
</svg>
